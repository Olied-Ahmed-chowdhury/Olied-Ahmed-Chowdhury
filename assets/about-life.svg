<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="about_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b16"/>
      <stop offset="50%" stop-color="#0c142b"/>
      <stop offset="100%" stop-color="#070b16"/>
    </linearGradient>

    <linearGradient id="about_card_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172e"/>
      <stop offset="100%" stop-color="#080e1c"/>
    </linearGradient>

    <linearGradient id="about_border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247bff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ff354f" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="about_slide_border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff354f" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#247bff" stop-opacity="0.8"/>
    </linearGradient>

    <clipPath id="slide_img_clip">
      <rect x="0" y="0" width="450" height="220" rx="14"/>
    </clipPath>

    <pattern id="about_grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#38bdf8" fill-opacity="0.1"/>
    </pattern>

    <style>
      .font-sans {
        font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .font-mono {
        font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="920" height="490" rx="20" fill="url(#about_bg)"/>
  <rect width="920" height="490" rx="20" fill="url(#about_grid)"/>
  <rect width="920" height="490" rx="20" stroke="url(#about_border)" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(45, 45)">
    <text x="0" y="0" fill="#38bdf8" font-size="12" font-weight="700" class="font-mono" letter-spacing="2">02 // CAPABILITIES &amp; LIFE CAROUSEL</text>
    <text x="0" y="28" fill="#f8fafc" font-size="24" font-weight="800" class="font-sans">ENGINEERING MINDSET &amp; PASSIONS</text>
  </g>

  <!-- Left Column: Core Engineering Capabilities -->
  <g transform="translate(45, 110)">
    <!-- Card 1: AI & NLP -->
    <g transform="translate(0, 0)">
      <rect width="360" height="95" rx="12" fill="url(#about_card_grad)" stroke="#247bff" stroke-width="1" stroke-opacity="0.4"/>
      <circle cx="35" cy="35" r="18" fill="#0d2247"/>
      <text x="26" y="41" font-size="16">🧠</text>
      <text x="65" y="32" fill="#ffffff" font-size="15" font-weight="700" class="font-sans">AI &amp; NLP Intelligence</text>
      <text x="65" y="52" fill="#94a3b8" font-size="12" class="font-sans">Sentiment NLP analysis, conversational</text>
      <text x="65" y="70" fill="#94a3b8" font-size="12" class="font-sans">study buddy chatbots &amp; ML pipelines.</text>
    </g>

    <!-- Card 2: Modern Full-Stack & Extensions -->
    <g transform="translate(0, 110)">
      <rect width="360" height="95" rx="12" fill="url(#about_card_grad)" stroke="#ff354f" stroke-width="1" stroke-opacity="0.4"/>
      <circle cx="35" cy="35" r="18" fill="#33101c"/>
      <text x="26" y="41" font-size="16">⚡</text>
      <text x="65" y="32" fill="#ffffff" font-size="15" font-weight="700" class="font-sans">Full-Stack &amp; Extensions</text>
      <text x="65" y="52" fill="#94a3b8" font-size="12" class="font-sans">React, Next.js, Manifest V3 Chrome</text>
      <text x="65" y="70" fill="#94a3b8" font-size="12" class="font-sans">extensions (Nova), PHP &amp; modern UI.</text>
    </g>

    <!-- Card 3: Systems Architecture & SQL -->
    <g transform="translate(0, 220)">
      <rect width="360" height="95" rx="12" fill="url(#about_card_grad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
      <circle cx="35" cy="35" r="18" fill="#0a2a3b"/>
      <text x="26" y="41" font-size="16">🛡️</text>
      <text x="65" y="32" fill="#ffffff" font-size="15" font-weight="700" class="font-sans">Systems &amp; Database Design</text>
      <text x="65" y="52" fill="#94a3b8" font-size="12" class="font-sans">Java serialization architectures, MySQL,</text>
      <text x="65" y="70" fill="#94a3b8" font-size="12" class="font-sans">data structures &amp; clean scalable code.</text>
    </g>
  </g>

  <!-- Right Column: 3-Slide Auto-Cycling Interests Carousel -->
  <g transform="translate(430, 110)">
    <!-- Container Card -->
    <rect width="450" height="340" rx="16" fill="#080e1c" stroke="url(#about_slide_border)" stroke-width="1.5"/>

    <!-- Carousel Progress Bars at Top -->
    <g transform="translate(20, 15)">
      <!-- Segment 1 Indicator -->
      <rect x="0" y="0" width="130" height="4" rx="2" fill="#1e293b"/>
      <rect x="0" y="0" width="0" height="4" rx="2" fill="#38bdf8">
        <animate attributeName="width" values="0;130;130;0;0;0" dur="12s" repeatCount="indefinite" keyTimes="0;0.30;0.33;0.34;0.99;1"/>
      </rect>

      <!-- Segment 2 Indicator -->
      <rect x="140" y="0" width="130" height="4" rx="2" fill="#1e293b"/>
      <rect x="140" y="0" width="0" height="4" rx="2" fill="#ff354f">
        <animate attributeName="width" values="0;0;0;130;130;0" dur="12s" repeatCount="indefinite" keyTimes="0;0.33;0.34;0.64;0.67;1"/>
      </rect>

      <!-- Segment 3 Indicator -->
      <rect x="280" y="0" width="130" height="4" rx="2" fill="#1e293b"/>
      <rect x="280" y="0" width="0" height="4" rx="2" fill="#247bff">
        <animate attributeName="width" values="0;0;0;0;0;130" dur="12s" repeatCount="indefinite" keyTimes="0;0.66;0.67;0.68;0.97;1"/>
      </rect>
    </g>

    <!-- Slide 1: Snooker & 8-Ball Pool (0s - 4s) -->
    <g transform="translate(0, 30)">
      <animate attributeName="opacity" values="1;1;0;0;0;0;1" dur="12s" repeatCount="indefinite" keyTimes="0;0.30;0.33;0.66;0.67;0.97;1"/>
      <!-- Stylized Vector Pool Canvas Banner -->
      <g clip-path="url(#slide_img_clip)">
        <rect width="450" height="190" fill="#04121a"/>
        <circle cx="225" cy="95" r="85" fill="#0d9488" fill-opacity="0.15"/>
        <circle cx="160" cy="75" r="14" fill="#fbbf24"/>
        <circle cx="160" cy="75" r="8" fill="#ffffff"/>
        <text x="157" y="79" font-size="9" font-weight="900" fill="#000" class="font-mono">1</text>
        <circle cx="190" cy="90" r="14" fill="#dc2626"/>
        <circle cx="190" cy="90" r="8" fill="#ffffff"/>
        <text x="187" y="94" font-size="9" font-weight="900" fill="#000" class="font-mono">3</text>
        <circle cx="225" cy="85" r="15" fill="#090d16" stroke="#ffffff" stroke-width="1.5"/>
        <circle cx="225" cy="85" r="8" fill="#ffffff"/>
        <text x="222" y="89" font-size="9" font-weight="900" fill="#000" class="font-mono">8</text>
        <circle cx="255" cy="75" r="14" fill="#2563eb"/>
        <circle cx="255" cy="75" r="8" fill="#ffffff"/>
        <text x="252" y="79" font-size="9" font-weight="900" fill="#000" class="font-mono">2</text>
        <circle cx="290" cy="95" r="14" fill="#ea580c"/>
        <circle cx="290" cy="95" r="8" fill="#ffffff"/>
        <text x="287" y="99" font-size="9" font-weight="900" fill="#000" class="font-mono">5</text>
        <!-- Cue stick vector -->
        <line x1="80" y1="145" x2="205" y2="92" stroke="#d97706" stroke-width="4" stroke-linecap="round"/>
        <line x1="205" y1="92" x2="218" y2="87" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
      </g>
      <rect x="20" y="150" width="140" height="24" rx="12" fill="#0b1a38" stroke="#38bdf8" stroke-width="1"/>
      <text x="32" y="166" fill="#38bdf8" font-size="11" font-weight="700" class="font-mono">🎱 8-BALL &amp; SNOOKER</text>
      
      <!-- Description -->
      <g transform="translate(20, 205)">
        <text x="0" y="18" fill="#f8fafc" font-size="16" font-weight="800" class="font-sans">Precision, Angles &amp; Strategic Composure</text>
        <text x="0" y="42" fill="#94a3b8" font-size="12" class="font-sans">Every problem is like a snooker frame: calculating multi-step</text>
        <text x="0" y="60" fill="#94a3b8" font-size="12" class="font-sans">positioning, staying cool under pressure, and executing cleanly.</text>
      </g>
    </g>

    <!-- Slide 2: Argentina & Football Passion (4s - 8s) -->
    <g transform="translate(0, 30)">
      <animate attributeName="opacity" values="0;0;1;1;0;0;0" dur="12s" repeatCount="indefinite" keyTimes="0;0.32;0.34;0.64;0.67;0.97;1"/>
      <!-- Stylized Vector Football Canvas Banner -->
      <g clip-path="url(#slide_img_clip)">
        <rect width="450" height="190" fill="#061226"/>
        <circle cx="225" cy="95" r="85" fill="#38bdf8" fill-opacity="0.15"/>
        <!-- Albiceleste stripes -->
        <rect x="150" y="15" width="25" height="160" rx="4" fill="#38bdf8" fill-opacity="0.25"/>
        <rect x="195" y="15" width="25" height="160" rx="4" fill="#ffffff" fill-opacity="0.25"/>
        <rect x="240" y="15" width="25" height="160" rx="4" fill="#38bdf8" fill-opacity="0.25"/>
        <rect x="285" y="15" width="25" height="160" rx="4" fill="#ffffff" fill-opacity="0.25"/>
        <!-- Sol de Mayo Golden Sun Motif -->
        <circle cx="225" cy="95" r="28" fill="#f59e0b" fill-opacity="0.3" stroke="#f59e0b" stroke-width="2"/>
        <text x="213" y="102" font-size="22">⚽</text>
      </g>
      <rect x="20" y="150" width="165" height="24" rx="12" fill="#1f0a14" stroke="#ff354f" stroke-width="1"/>
      <text x="32" y="166" fill="#ff354f" font-size="11" font-weight="700" class="font-mono">⚽ ALBILESTE &amp; SPORTS</text>
      
      <!-- Description -->
      <g transform="translate(20, 205)">
        <text x="0" y="18" fill="#f8fafc" font-size="16" font-weight="800" class="font-sans">Championship Mindset &amp; Relentless Drive</text>
        <text x="0" y="42" fill="#94a3b8" font-size="12" class="font-sans">Bringing championship energy, unshakeable teamwork,</text>
        <text x="0" y="60" fill="#94a3b8" font-size="12" class="font-sans">and fierce passion to software development and problem solving.</text>
      </g>
    </g>

    <!-- Slide 3: AI & Research Innovation (8s - 12s) -->
    <g transform="translate(0, 30)">
      <animate attributeName="opacity" values="0;0;0;0;1;1;0" dur="12s" repeatCount="indefinite" keyTimes="0;0.65;0.66;0.68;0.97;0.99;1"/>
      <!-- Stylized Vector AI Canvas Banner -->
      <g clip-path="url(#slide_img_clip)">
        <rect width="450" height="190" fill="#090d1f"/>
        <circle cx="225" cy="95" r="85" fill="#818cf8" fill-opacity="0.15"/>
        <!-- Neural network nodes and connections -->
        <line x1="160" y1="95" x2="225" y2="55" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>
        <line x1="160" y1="95" x2="225" y2="135" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>
        <line x1="225" y1="55" x2="290" y2="95" stroke="#ff354f" stroke-width="1.5" stroke-opacity="0.6"/>
        <line x1="225" y1="135" x2="290" y2="95" stroke="#ff354f" stroke-width="1.5" stroke-opacity="0.6"/>
        <circle cx="160" cy="95" r="14" fill="#0e1d3e" stroke="#38bdf8" stroke-width="2"/>
        <text x="154" y="99" font-size="12">📥</text>
        <circle cx="225" cy="55" r="16" fill="#1b1233" stroke="#818cf8" stroke-width="2"/>
        <text x="218" y="60" font-size="14">🧠</text>
        <circle cx="225" cy="135" r="16" fill="#1b1233" stroke="#818cf8" stroke-width="2"/>
        <text x="218" y="140" font-size="14">⚡</text>
        <circle cx="290" cy="95" r="14" fill="#2d0f1e" stroke="#ff354f" stroke-width="2"/>
        <text x="284" y="99" font-size="12">✨</text>
      </g>
      <rect x="20" y="150" width="160" height="24" rx="12" fill="#08202c" stroke="#247bff" stroke-width="1"/>
      <text x="32" y="166" fill="#38bdf8" font-size="11" font-weight="700" class="font-mono">🧠 AI &amp; SYSTEM RESEARCH</text>
      
      <!-- Description -->
      <g transform="translate(20, 205)">
        <text x="0" y="18" fill="#f8fafc" font-size="16" font-weight="800" class="font-sans">Architecting The Next Tech Wave</text>
        <text x="0" y="42" fill="#94a3b8" font-size="12" class="font-sans">Continuous exploration in NLP, neural architectures,</text>
        <text x="0" y="60" fill="#94a3b8" font-size="12" class="font-sans">intelligent automation, and crafting intuitive user workflows.</text>
      </g>
    </g>
  </g>
</svg>