<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="920" height="380">
  <defs>
    <linearGradient id="sb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050810"/><stop offset="100%" stop-color="#07101e"/>
    </linearGradient>
    <linearGradient id="sborder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247bff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ff4060" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="score" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247bff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#ff4060"/>
    </linearGradient>
    <radialGradient id="sglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#247bff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <pattern id="sdots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.9" fill="#247bff" fill-opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="920" height="380" rx="18" fill="url(#sb)"/>
  <rect width="920" height="380" rx="18" fill="url(#sdots)"/>
  <rect width="920" height="380" rx="18" stroke="url(#sborder)" stroke-width="1.5" fill="none"/>

  <!-- Header left -->
  <text x="45" y="46" fill="#38bdf8" font-size="11" font-weight="700" font-family="Consolas,monospace" letter-spacing="2">03 // TECHNOLOGY ARSENAL</text>
  <text x="45" y="74" fill="#f8fafc" font-size="22" font-weight="800" font-family="'Segoe UI',Roboto,sans-serif">TECH STACK &amp; TOOLS</text>

  <!-- Tech grid chips (left column) -->
  <g transform="translate(45, 105)">
    <!-- Row 1 -->
    <rect width="95" height="30" rx="8" fill="#0c1836" stroke="#247bff" stroke-width="1"/>
    <text x="12" y="20" font-size="13">🐍</text><text x="32" y="20" fill="#f8fafc" font-size="12" font-weight="700" font-family="Consolas,monospace">Python</text>
    <rect x="105" width="88" height="30" rx="8" fill="#0c1836" stroke="#247bff" stroke-width="1"/>
    <text x="117" y="20" font-size="13">⚛️</text><text x="135" y="20" fill="#38bdf8" font-size="12" font-weight="700" font-family="Consolas,monospace">React</text>
    <rect x="203" width="105" height="30" rx="8" fill="#0c1836" stroke="#247bff" stroke-width="1"/>
    <text x="215" y="20" font-size="13">▲</text><text x="233" y="20" fill="#f8fafc" font-size="12" font-weight="700" font-family="Consolas,monospace">Next.js</text>
    <rect x="318" width="88" height="30" rx="8" fill="#0c1836" stroke="#38bdf8" stroke-width="1"/>
    <text x="330" y="20" font-size="13">☕</text><text x="348" y="20" fill="#f8fafc" font-size="12" font-weight="700" font-family="Consolas,monospace">Java</text>

    <!-- Row 2 -->
    <rect y="42" width="88" height="30" rx="8" fill="#1a0c1e" stroke="#ff4060" stroke-width="1"/>
    <text x="12" y="62" font-size="13">🧠</text><text x="30" y="62" fill="#ff4060" font-size="12" font-weight="700" font-family="Consolas,monospace">NLP/AI</text>
    <rect x="98" y="42" width="100" height="30" rx="8" fill="#1a0c1e" stroke="#ff4060" stroke-width="1"/>
    <text x="110" y="62" font-size="13">🧩</text><text x="128" y="62" fill="#f8fafc" font-size="12" font-weight="700" font-family="Consolas,monospace">Chrome Ext</text>
    <rect x="208" y="42" width="80" height="30" rx="8" fill="#1a0c1e" stroke="#ff4060" stroke-width="1"/>
    <text x="220" y="62" font-size="13">🐬</text><text x="238" y="62" fill="#38bdf8" font-size="12" font-weight="700" font-family="Consolas,monospace">MySQL</text>
    <rect x="298" y="42" width="108" height="30" rx="8" fill="#1a0c1e" stroke="#ff4060" stroke-width="1"/>
    <text x="310" y="62" font-size="13">🌐</text><text x="328" y="62" fill="#f8fafc" font-size="12" font-weight="700" font-family="Consolas,monospace">TypeScript</text>

    <!-- Row 3 -->
    <rect y="84" width="76" height="30" rx="8" fill="#071d28" stroke="#38bdf8" stroke-width="1"/>
    <text x="12" y="104" font-size="13">🐘</text><text x="30" y="104" fill="#38bdf8" font-size="12" font-weight="700" font-family="Consolas,monospace">PHP</text>
    <rect x="86" y="84" width="108" height="30" rx="8" fill="#071d28" stroke="#38bdf8" stroke-width="1"/>
    <text x="98" y="104" font-size="13">🔗</text><text x="116" y="104" fill="#f8fafc" font-size="12" font-weight="700" font-family="Consolas,monospace">REST APIs</text>
    <rect x="204" y="84" width="88" height="30" rx="8" fill="#071d28" stroke="#38bdf8" stroke-width="1"/>
    <text x="216" y="104" font-size="13">🐙</text><text x="234" y="104" fill="#f8fafc" font-size="12" font-weight="700" font-family="Consolas,monospace">GitHub</text>
    <rect x="302" y="84" width="104" height="30" rx="8" fill="#071d28" stroke="#38bdf8" stroke-width="1"/>
    <text x="314" y="104" font-size="13">🎨</text><text x="332" y="104" fill="#f8fafc" font-size="12" font-weight="700" font-family="Consolas,monospace">Tailwind</text>

    <!-- Row 4 specialties -->
    <rect y="126" width="140" height="30" rx="8" fill="#060d1c" stroke="#247bff" stroke-width="1" stroke-opacity="0.5"/>
    <text x="12" y="146" font-size="13">📊</text><text x="30" y="146" fill="#94a3b8" font-size="12" font-family="Consolas,monospace">Sentiment Analysis</text>
    <rect x="150" y="126" width="145" height="30" rx="8" fill="#060d1c" stroke="#247bff" stroke-width="1" stroke-opacity="0.5"/>
    <text x="162" y="146" font-size="13">🤖</text><text x="180" y="146" fill="#94a3b8" font-size="12" font-family="Consolas,monospace">Conversational AI</text>
    <rect x="305" y="126" width="101" height="30" rx="8" fill="#060d1c" stroke="#247bff" stroke-width="1" stroke-opacity="0.5"/>
    <text x="317" y="146" font-size="13">📦</text><text x="335" y="146" fill="#94a3b8" font-size="12" font-family="Consolas,monospace">Java OOP</text>
  </g>

  <!-- Right: Animated orbit system -->
  <g transform="translate(728, 195)">
    <circle cx="0" cy="0" r="120" fill="url(#sglow)"/>
    <ellipse cx="0" cy="0" rx="145" ry="65" stroke="url(#score)" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="8 6" fill="none">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="25s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="0" cy="0" rx="105" ry="48" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5" fill="none">
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="18s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="0" cy="0" rx="68" ry="30" stroke="#ff4060" stroke-width="1.2" stroke-opacity="0.5" stroke-dasharray="4 4" fill="none">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
    </ellipse>
    <!-- Center -->
    <circle cx="0" cy="0" r="38" fill="#080f20" stroke="url(#score)" stroke-width="2.2"/>
    <text x="-18" y="-4" fill="#38bdf8" font-size="9" font-weight="800" font-family="Consolas,monospace">CORE</text>
    <text x="-22" y="12" fill="#f8fafc" font-size="12" font-weight="900" font-family="'Segoe UI',sans-serif">STACK</text>
    <!-- Floating chips -->
    <g><animateTransform attributeName="transform" type="translate" values="-130 -40;-130 -46;-130 -40" dur="3.5s" repeatCount="indefinite"/>
      <rect x="-46" y="-14" width="92" height="28" rx="14" fill="#0b1a38" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="-34" y="4" font-size="12">🐍</text><text x="-16" y="4" fill="#f8fafc" font-size="11" font-weight="700" font-family="Consolas,monospace">Python</text>
    </g>
    <g><animateTransform attributeName="transform" type="translate" values="80 -52;80 -46;80 -52" dur="4s" repeatCount="indefinite"/>
      <rect x="-40" y="-14" width="88" height="28" rx="14" fill="#071d28" stroke="#247bff" stroke-width="1.2"/>
      <text x="-28" y="4" font-size="12">⚛️</text><text x="-10" y="4" fill="#38bdf8" font-size="11" font-weight="700" font-family="Consolas,monospace">React</text>
    </g>
    <g><animateTransform attributeName="transform" type="translate" values="110 30;110 36;110 30" dur="3.2s" repeatCount="indefinite"/>
      <rect x="-38" y="-14" width="84" height="28" rx="14" fill="#1f0b15" stroke="#ff4060" stroke-width="1.2"/>
      <text x="-26" y="4" font-size="12">🧠</text><text x="-8" y="4" fill="#ff4060" font-size="11" font-weight="700" font-family="Consolas,monospace">NLP</text>
    </g>
    <g><animateTransform attributeName="transform" type="translate" values="-120 36;-120 30;-120 36" dur="4.4s" repeatCount="indefinite"/>
      <rect x="-40" y="-14" width="88" height="28" rx="14" fill="#0a2030" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="-28" y="4" font-size="12">🐬</text><text x="-10" y="4" fill="#38bdf8" font-size="11" font-weight="700" font-family="Consolas,monospace">MySQL</text>
    </g>
  </g>
</svg>